[package]
name = "sanlycontrol"
version = "1.0.0"
description = "SanlyControl ýerli synp dolandyryş ulgamy"
authors = ["SanlyControl"]
edition = "2021"

[lib]
name = "sanlycontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
